name: ENGAGE Android pilot APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify or install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          if [[ ! -f "$sdk/platforms/android-35/android.jar" || ! -x "$sdk/build-tools/35.0.0/apksigner" ]]; then
            manager=$(find "$sdk/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
            test -x "$manager"
            set +o pipefail
            yes | "$manager" --sdk_root="$sdk" --licenses > /dev/null
            set -o pipefail
            "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/apksigner"
          java -version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: bash tests/run.sh
      - run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK and record checksum
        run: |
          set -euo pipefail
          mkdir -p pilot-output
          cp app/build/outputs/apk/debug/app-debug.apk pilot-output/ENGAGE-0.6.0-pilot.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs pilot-output/ENGAGE-0.6.0-pilot.apk | tee pilot-output/signature.txt
          (cd pilot-output && sha256sum ENGAGE-0.6.0-pilot.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ENGAGE-0.6.0-Android-pilot
          path: pilot-output/
          if-no-files-found: error
      - name: Android lint (required for wider release; private APK already archived)
        run: gradle --no-daemon --stacktrace :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
